name: FACET VA Integration Tests

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Nightly run at 06:00 UTC.
    - cron: "0 6 * * *"

jobs:
  va-tests:
    name: Run VA-backed test suite
    # Skip fork PRs because private repo secrets are unavailable.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/_va-test-template.yml
    with:
      va_name: facet
      runner_command: "fast_facet2_s2e --end-ele PR10711 --n-particles 1000"
      lattice_repo: slaclab/facet2-lattice
      lattice_env_var: FACET2_LATTICE
      pythonpath_subdir: facet
      readiness_pv: QUAD:IN10:121:BCTRL
      pytest_marker: facet_va
      artifact_name_suffix: facet
    secrets: inherit