[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-control"
version = "0.1.0"
description = "Code used to run autonomous operations at FACET-II and AWA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy",
	"pandas",
	"matplotlib",
	"torch",
	"botorch",
	"gpytorch",
	"xopt",
	"pydantic>=2",
	"tenacity",
	"pyepics",
	"bax-algorithms",
]

[project.optional-dependencies]
facility = [
	"lcls-tools @ git+https://github.com/slaclab/lcls-tools.git",
	"ml-tto @ git+https://github.com/slaclab/ml-tto.git",
]
test = [
	"pytest",
]
dev = [
	"pytest",
	"ruff",
	"pre-commit",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["autonomous_control*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
